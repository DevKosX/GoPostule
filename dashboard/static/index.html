<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Candidatures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="gradient-bg text-white py-8 px-6 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold mb-2">📊 Dashboard Candidatures</h1>
            <p class="text-purple-100">Bot de Candidatures Automatiques</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl p-6 card-shadow">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Candidatures</p>
                        <p class="text-3xl font-bold text-gray-900" id="total">-</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 card-shadow">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Envoyées</p>
                        <p class="text-3xl font-bold text-green-600" id="sent">-</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 card-shadow">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Erreurs</p>
                        <p class="text-3xl font-bold text-red-600" id="errors">-</p>
                    </div>
                    <div class="bg-red-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 card-shadow">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Taux de succès</p>
                        <p class="text-3xl font-bold text-purple-600" id="success-rate">-</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>


        <!-- Dernières candidatures -->
        <div class="bg-white rounded-xl p-3 card-shadow">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-gray-900">📋 Dernières candidatures</h2>
                <div class="flex items-center space-x-1">
                    <input type="text" id="search-input" placeholder="Rechercher..." 
                           class="px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:ring-2 focus:ring-purple-500"
                           onkeyup="filterTable()">
                    <select id="status-filter" onchange="filterTable()"
                            class="px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">Tous</option>
                        <option value="SENT">Envoyées</option>
                        <option value="ERROR">Erreurs</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto max-h-64 overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase">Entreprise</th>
                            <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase">Poste</th>
                            <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase">Statut</th>
                            <th class="px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="recent-table">
                        <tr>
                            <td colspan="4" class="px-2 py-2 text-center text-gray-500 text-xs">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p class="text-xs text-gray-500" id="table-info">Affichage de 0 sur 0 candidatures</p>
                <div class="flex space-x-1" id="pagination">
                    <button onclick="changePage(-1)" class="px-2 py-1 bg-gray-200 rounded text-xs hover:bg-gray-300 disabled:opacity-50" id="prev-btn">←</button>
                    <button onclick="changePage(1)" class="px-2 py-1 bg-gray-200 rounded text-xs hover:bg-gray-300 disabled:opacity-50" id="next-btn">→</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-8 py-6">
        <div class="max-w-7xl mx-auto px-6 text-center text-gray-500 text-sm">
            <p>Dashboard Candidatures</p>
            <p class="mt-1">Dernière mise à jour: <span id="last-update">-</span></p>
        </div>
    </footer>

    <script>
        let stats = null;
        let currentPage = 1;
        const itemsPerPage = 25;
        let filteredData = [];

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                stats = await response.json();
                filteredData = stats.recent_applications;
                updateUI();
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function updateUI() {
            // Update KPIs
            document.getElementById('total').textContent = stats.total;
            document.getElementById('sent').textContent = stats.total_sent;
            document.getElementById('errors').textContent = stats.total_errors;
            document.getElementById('success-rate').textContent = stats.total > 0 
                ? ((stats.total_sent / stats.total) * 100).toFixed(1) + '%' 
                : '0%';
            document.getElementById('last-update').textContent = new Date().toLocaleDateString('fr-FR');

            // Update recent applications table
            updateRecentTable();
        }

        function filterTable() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            filteredData = stats.recent_applications.filter(app => {
                const matchesSearch = app.company.toLowerCase().includes(searchTerm) || 
                                     app.role.toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === '' || app.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            currentPage = 1;
            updateRecentTable();
        }

        function changePage(direction) {
            const maxPage = Math.ceil(filteredData.length / itemsPerPage);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > maxPage) currentPage = maxPage;
            updateRecentTable();
        }

        function updateRecentTable() {
            const tbody = document.getElementById('recent-table');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-2 py-2 text-center text-gray-500 text-xs">Aucune candidature trouvée</td></tr>';
                document.getElementById('table-info').textContent = 'Affichage de 0 sur 0 candidatures';
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
                return;
            }

            pageData.forEach(app => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-2 py-1 whitespace-nowrap text-xs font-medium text-gray-900">${app.company}</td>
                    <td class="px-2 py-1 text-xs text-gray-500 max-w-xs truncate" title="${app.role}">${app.role.substring(0, 40)}${app.role.length > 40 ? '...' : ''}</td>
                    <td class="px-2 py-1 whitespace-nowrap">
                        <span class="px-1 inline-flex text-xs leading-4 font-semibold rounded ${
                            app.status === 'SENT' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                        }">
                            ${app.status}
                        </span>
                    </td>
                    <td class="px-2 py-1 whitespace-nowrap text-xs text-gray-500">
                        ${new Date(app.ts).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Update pagination info
            const maxPage = Math.ceil(filteredData.length / itemsPerPage);
            document.getElementById('table-info').textContent = `Affichage de ${startIndex + 1}-${Math.min(endIndex, filteredData.length)} sur ${filteredData.length} candidatures`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === maxPage;
        }

        // Load stats on page load
        loadStats();
    </script>
</body>
</html>
